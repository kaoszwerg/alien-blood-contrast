name: Publish

# Tag a release to publish it:
#   npm version 0.4.0 --no-git-tag-version && git commit -am "Bump to v0.4.0"
#   git tag v0.4.0 && git push && git push --tags
#
# Requires a repository secret VSCE_PAT — an Azure DevOps personal access
# token for the publisher account, scoped to Marketplace > Manage.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check only, do not publish'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # A Marketplace version cannot be replaced, only superseded — so every
      # check runs before anything is uploaded.
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing version $PKG"

      - name: Generated files are up to date
        run: |
          npm run build
          if ! git diff --quiet; then
            echo "::error::Generated files are stale. Run 'npm run build' and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Package
        run: npx --yes @vscode/vsce package --out extension.vsix

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        run: npx --yes @vscode/vsce publish --packagePath extension.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Attach VSIX to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: extension.vsix
          generate_release_notes: true
